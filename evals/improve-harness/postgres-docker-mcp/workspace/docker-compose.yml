services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s

  api:
    build: .
    command: ["/app/orders-api"]
    environment:
      DATABASE_URL: postgres://orders:orders@db:5432/orders?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["/app/orders-worker"]
    environment:
      DATABASE_URL: postgres://orders:orders@db:5432/orders?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
