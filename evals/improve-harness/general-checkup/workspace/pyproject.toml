[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "billing-service"
version = "1.8.2"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.120",
  "psycopg[binary]>=3.2",
  "sentry-sdk>=2.40",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[tool.ruff]
target-version = "py313"
